name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.x'
      - name: Install file search tool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fd-find
      - name: Install file search tool (macOS)
        if: runner.os == 'macOS'
        run: brew install fd
      - run: bun install --frozen-lockfile
      - run: bun run build:release
      - run: bun run check
      - run: bun run test
      - run: bun run test:package
