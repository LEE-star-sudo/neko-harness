name: Mobile
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/gateway/test/fixtures/mobile-api-v1/**
      - .github/workflows/mobile.yml
  pull_request:
    paths:
      - apps/mobile/**
      - packages/gateway/test/fixtures/mobile-api-v1/**
      - .github/workflows/mobile.yml
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # 包含读取 gateway 协议 fixtures 的 Dart 对拍测试。
      - run: flutter test
      # 无签名资料时以 debug 签名构建 release 变体，仅作编译验证，不上传产物；
      # 正式的 release 包由 release.yml 在发版时构建并附到 GitHub Release。
      - run: flutter build apk --release --split-per-abi
